<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>柑橘音乐 - 招新系统</title>
    <style>
        :root { --primary: #1890ff; --bg: #f0f2f5; --text-main: #333333; --border: #d9d9d9; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding-top: 5vh; color: var(--text-main); }
        .container { width: 100%; max-width: 950px; padding: 20px; }
        
        .card { background: #ffffff; padding: 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: none; }
        .card.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        h1 { text-align: center; color: #1f2937; font-size: 24px; margin-bottom: 30px; font-weight: 600; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #4b5563; font-size: 14px; font-weight: 500; }
        input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; outline: none; font-size: 14px; transition: 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(24,144,255,0.2); }
        
        .btn { padding: 10px 16px; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #40a9ff; }
        .btn-full { width: 100%; margin-top: 10px; }
        .btn-sm { padding: 6px 12px; font-size: 13px; }
        .btn-outline { background: transparent; color: var(--text-main); border: 1px solid var(--border); }
        .btn-outline:hover { background: #fafafa; }
        .btn-ai { background: linear-gradient(135deg, #8b5cf6, #6366f1); color: white; border: none; }
        .btn-ai:hover { background: linear-gradient(135deg, #7c3aed, #4f46e5); }
        
        .toggle-link { display: block; text-align: center; margin-top: 20px; color: var(--primary); cursor: pointer; font-size: 14px; }
        .toggle-link:hover { text-decoration: underline; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .nav-tabs { display: flex; gap: 20px; }
        .nav-tabs span { cursor: pointer; font-size: 16px; font-weight: 500; color: #666; padding-bottom: 5px; }
        .nav-tabs span.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background-color: #fafafa; color: #4b5563; font-weight: 500; }
        tr:hover { background-color: #fafafa; }

        /* 🌟 申请人进度条 */
        .progress-container { margin-top: 40px; padding: 20px; background: #fff; border-radius: 8px; border: 1px solid var(--border); }
        .steps { display: flex; justify-content: space-between; position: relative; margin-bottom: 30px; }
        .steps::before { content: ''; position: absolute; top: 15px; left: 0; right: 0; height: 3px; background: #e5e7eb; z-index: 1; }
        .step { position: relative; z-index: 2; text-align: center; flex: 1; }
        .step-circle { width: 32px; height: 32px; background: #e5e7eb; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-size: 14px; }
        .step-text { font-size: 13px; color: #6b7280; font-weight: 500; }
        .step.active .step-circle { background: var(--primary); box-shadow: 0 0 0 3px rgba(24,144,255,0.2); }
        .step.active .step-text { color: var(--primary); }
        .step.success .step-circle { background: #52c41a; }
        .step.success .step-text { color: #52c41a; }
        .step.fail .step-circle { background: #ff4d4f; }
        .step.fail .step-text { color: #ff4d4f; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 80%; max-width: 750px; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; max-height: 90vh; }
        .modal-header { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 20px; overflow-y: auto; }
        
        .ai-box { background: #f5f3ff; border: 1px solid #ddd6fe; padding: 15px; border-radius: 6px; margin: 15px 0; font-size: 14px; line-height: 1.5; color: #4c1d95;}
        .ps-content { background: #f9fafb; padding: 15px; border-radius: 6px; border: 1px solid var(--border); font-size: 14px; line-height: 1.6; white-space: pre-wrap; }

        .scan-container { text-align: center; padding: 50px 20px; }
        .scan-input { font-size: 28px !important; text-align: center; letter-spacing: 2px; font-weight: bold; padding: 20px !important; border: 3px solid var(--primary) !important; width: 80% !important; margin: 0 auto; }
        .scan-result { margin-top: 30px; font-size: 24px; font-weight: bold; min-height: 40px; }
        .success-text { color: #52c41a; }
        .error-text { color: #ff4d4f; }
        
        .action-btn-group { display: none; margin-top: 20px; justify-content: center; gap: 15px; }
        .action-btn-group .btn { font-size: 16px; padding: 12px 24px; }

        .score-section { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 20px; border-radius: 8px; margin-top: 25px; }
        .score-inputs { display: flex; gap: 15px; margin-bottom: 15px; }
        .score-inputs div { flex: 1; }
        .score-inputs label { color: #166534; }
        .score-inputs input { border-color: #86efac; }
        .score-inputs input:focus { border-color: #22c55e; box-shadow: 0 0 0 2px rgba(34,197,94,0.2); }
        .eval-comment { width: 100%; padding: 10px; border: 1px solid #86efac; border-radius: 6px; outline: none; resize: vertical; min-height: 60px; }
    </style>
</head>
<body>
<div class="container">
    <!-- 登录 -->
    <div class="card active" id="loginCard" style="max-width: 400px; margin: 0 auto;">
        <h1>柑橘音乐 招新系统</h1>
        <div class="form-group"><label>账号</label><input type="text" id="login_user"></div>
        <div class="form-group"><label>密码</label><input type="password" id="login_pwd"></div>
        <button class="btn btn-full" onclick="login()">登 录</button>
        <span class="toggle-link" onclick="switchCard('registerCard')">没有账号？点击注册</span>
    </div>

    <!-- 注册 -->
    <div class="card" id="registerCard" style="max-width: 400px; margin: 0 auto;">
        <h1>创建账户</h1>
        <div class="form-group"><label>账号</label><input type="text" id="reg_user"></div>
        <div class="form-group"><label>密码</label><input type="password" id="reg_pwd"></div>
        <button class="btn btn-full" onclick="register()">注 册</button>
        <span class="toggle-link" onclick="switchCard('loginCard')">已有账号？返回登录</span>
    </div>

    <!-- 申请人面板 -->
    <div class="card" id="userCard">
        <div class="top-bar">
            <h2>申请人中心</h2>
            <button class="btn btn-sm btn-outline" onclick="logout()">退出登录</button>
        </div>
        <div id="applySection">
            <div class="form-group"><label>真实姓名</label><input type="text" id="name"></div>
            <div class="form-group"><label>学号</label><input type="text" id="student_id"></div>
            <div class="form-group"><label>手机尾号</label><input type="text" id="phone_last4" maxlength="4"></div>
            <div class="form-group"><label>意向部门</label>
                <select id="department"><option>主唱部</option><option>器乐部</option><option>创作部</option><option>宣传部</option></select>
            </div>
            <div class="form-group"><label>个人陈述</label><textarea id="ps_content" rows="5"></textarea></div>
            <button class="btn btn-full" onclick="submitForm()">提交并下载 PDF 报名表</button>
        </div>
        
        <!-- 🌟 申请人进度追踪 -->
        <div id="statusSection" style="display: none;">
            <h3 style="color: #52c41a; margin-bottom: 10px; text-align: center;">✅ 报名表已提交</h3>
            <p style="text-align: center; color: #666; margin-bottom: 20px;">你的专属签到编号：<strong id="my_barcode" style="color: #1890ff; font-size: 20px;"></strong></p>
            
            <div class="progress-container">
                <div class="steps" id="stepsContainer">
                    <!-- 动态生成 -->
                </div>
                <div id="statusMessage" style="text-align: center; font-size: 15px; font-weight: bold; padding: 10px; border-radius: 6px;"></div>
            </div>
        </div>
    </div>

    <!-- 管理员面板 -->
    <div class="card" id="adminCard">
        <div class="top-bar">
            <div class="nav-tabs">
                <span id="tab_list" class="active" onclick="switchAdminTab('list')">报名列表</span>
                <span id="tab_checkin" onclick="switchAdminTab('checkin')">现场扫码签到</span>
            </div>
            <div class="actions">
                <button class="btn btn-sm btn-outline" onclick="exportCSV()">导出 CSV</button>
                <button class="btn btn-sm btn-outline" onclick="logout()">退出</button>
            </div>
        </div>
        
        <div id="adminListView">
            <div style="margin-bottom: 10px; display: flex; justify-content: flex-end;">
                <label style="display: flex; align-items: center; font-size: 14px; cursor: pointer;">
                    <input type="checkbox" id="sortScoreCheckbox" onchange="loadAdminList()" style="width: auto; margin-right: 8px;"> 按总分降序排列
                </label>
            </div>
            <table>
                <thead><tr><th>编号</th><th>姓名</th><th>部门</th><th>状态</th><th>总分</th><th>操作</th></tr></thead>
                <tbody id="adminTableBody"></tbody>
            </table>
        </div>

        <div id="adminCheckInView" style="display: none;">
            <div class="scan-container">
                <h2 style="margin-bottom: 20px; color: #333;">请使用扫码枪扫描 PDF 上的编号</h2>
                <p style="color: #888; margin-bottom: 30px;">（或者手动输入 TG 编号后按回车）</p>
                <input type="text" id="scanInput" class="scan-input" placeholder="TGXXXXXXXX" autocomplete="off">
                <div id="scanResult" class="scan-result"></div>
                <div id="scanActionBox" class="action-btn-group">
                    <button class="btn" onclick="previewPDF(lastScannedCode)">📄 查看 PDF 报名表</button>
                    <button class="btn btn-outline" onclick="openReview(lastScannedCode)">🔍 查看详情与打分</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 审核 & 打分弹窗 -->
<div id="reviewModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3 style="font-size: 16px;">详情与面试打分 - <span id="rv_name"></span></h3>
            <button class="btn btn-sm btn-outline" onclick="closeReview()">关闭</button>
        </div>
        <div class="modal-body">
            <p><strong>意向部门：</strong> <span id="rv_dept"></span></p>
            <p style="margin-top: 15px;"><strong>个人陈述原文：</strong></p>
            <div class="ps-content" id="rv_ps"></div>

            <div style="margin-top: 20px; display: flex; align-items: center; justify-content: space-between;">
                <strong>AI 核心摘要：</strong>
                <button class="btn btn-sm btn-ai" onclick="generateAISummary()" id="btnAi">✨ 一键生成摘要</button>
            </div>
            <div class="ai-box" id="rv_ai_summary" style="display: none;"></div>

            <div style="margin-top: 20px; display: flex; align-items: center; justify-content: space-between;">
                <strong>AI 面试问题定制：</strong>
                <button class="btn btn-sm btn-ai" onclick="generateAIQuestions()" id="btnAiQ">✨ 生成专属面试题</button>
            </div>
            <div class="ai-box" id="rv_ai_questions" style="display: none; background: #e0f2fe; border-color: #bae6fd; color: #0369a1;"></div>

            <div class="score-section">
                <h3 style="font-size: 15px; color: #166534; margin-bottom: 15px;">📝 面试官打分</h3>
                <div class="score-inputs">
                    <div><label>沟通表达</label><input type="number" id="score_exp" min="1" max="10"></div>
                    <div><label>专业技能</label><input type="number" id="score_skill" min="1" max="10"></div>
                    <div><label>综合评价 (1-100)</label><input type="number" id="score_total" min="1" max="100"></div>
                </div>
                <label>评语备注</label>
                <textarea id="eval_comment" class="eval-comment" placeholder="记录候选人亮点或淘汰原因..."></textarea>
                <button class="btn" style="background: #52c41a; width: 100%; margin-top: 15px;" onclick="submitScore()">保存评分</button>
            </div>

            <!-- 🌟 最终决定 -->
            <div style="margin-top: 30px; border-top: 1px solid var(--border); padding-top: 20px; display: flex; justify-content: space-between; align-items: center;">
                <div style="font-size: 14px; color: #666;">最终决定：</div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-outline" onclick="updateStatus('未通过')">❌ 预审淘汰</button>
                    <button class="btn btn-outline" onclick="updateStatus('初筛通过')">⏳ 初筛通过</button>
                    <button class="btn" style="background: #ff4d4f;" onclick="updateStatus('未录取')">❌ 面试淘汰</button>
                    <button class="btn" style="background: #52c41a;" onclick="updateStatus('已录取')">🎉 确认录取</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- PDF 预览弹窗 -->
<div id="pdfModal" class="modal-overlay">
    <div class="modal-content" style="width: 85%; height: 85%; max-width: none;">
        <div class="modal-header">
            <h3 style="font-size: 16px;">PDF 报名表预览</h3>
            <button class="btn btn-sm btn-outline" onclick="closePDF()">关闭</button>
        </div>
        <iframe id="pdfIframe" src="" style="width: 100%; height: 100%; border: none;"></iframe>
    </div>
</div>

<script>
    let currentUser = "";
    let currentRole = "";
    let currentReviewId = "";

    function switchCard(id) {
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    async function login() {
        const username = document.getElementById('login_user').value;
        const password = document.getElementById('login_pwd').value;
        const res = await fetch('/api/login', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        const data = await res.json();
        if (data.status === 'success') {
            currentUser = username;
            currentRole = data.role;
            if(currentRole === 'admin') {
                switchCard('adminCard');
                switchAdminTab('list');
                loadAdminList();
            } else {
                switchCard('userCard');
                checkMyStatus();
            }
        } else alert(data.message);
    }

    async function register() {
        const username = document.getElementById('reg_user').value;
        const password = document.getElementById('reg_pwd').value;
        const res = await fetch('/api/register', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        const data = await res.json();
        alert(data.message);
        if(data.status === 'success') switchCard('loginCard');
    }

    // 🌟 申请人动态进度条渲染
    async function checkMyStatus() {
        const res = await fetch(`/api/my_application?username=${currentUser}`);
        const data = await res.json();
        if(data.status === 'success') {
            document.getElementById('applySection').style.display = 'none';
            document.getElementById('statusSection').style.display = 'block';
            document.getElementById('my_barcode').innerText = data.data.barcode_id;
            
            const status = data.data.status;
            const stepsContainer = document.getElementById('stepsContainer');
            const statusMessage = document.getElementById('statusMessage');
            
            const steps = [
                { key: '提交报名', match: ['待审核', '初筛通过', '未通过', '已签到', '面试中', '已录取', '未录取'] },
                { key: '初筛审核', match: ['初筛通过', '未通过', '已签到', '面试中', '已录取', '未录取'] },
                { key: '现场签到', match: ['已签到', '面试中', '已录取', '未录取'] },
                { key: '面试评估', match: ['已录取', '未录取'] }
            ];

            let html = '';
            let currentStepIndex = 0;
            
            if (status === '未通过' || status === '未录取') {
                currentStepIndex = -1; // 中断
            } else {
                steps.forEach((s, i) => {
                    if (s.match.includes(status)) currentStepIndex = i;
                });
            }

            steps.forEach((step, index) => {
                let className = '';
                if (currentStepIndex === -1) {
                    if (index <= 1 && status === '未通过') className = 'fail';
                    else if (index <= 3 && status === '未录取') className = 'fail';
                    else if (index < 2) className = 'success';
                } else {
                    if (index < currentStepIndex) className = 'success';
                    if (index === currentStepIndex) className = 'active';
                }
                
                html += `
                    <div class="step ${className}">
                        <div class="step-circle">${index + 1}</div>
                        <div class="step-text">${step.key}</div>
                    </div>
                `;
            });
            
            stepsContainer.innerHTML = html;
            
            if (status === '待审核') {
                statusMessage.innerText = '系统正在初筛中，请耐心等待...';
                statusMessage.style.color = '#fa8c16'; statusMessage.style.background = '#fff7e6';
            } else if (status === '初筛通过') {
                statusMessage.innerText = '恭喜！初筛已通过，请留意面试通知。';
                statusMessage.style.color = '#52c41a'; statusMessage.style.background = '#f6ffed';
            } else if (status === '未通过') {
                statusMessage.innerText = '很遗憾，本次初筛未能通过。';
                statusMessage.style.color = '#ff4d4f'; statusMessage.style.background = '#fff1f0';
            } else if (status === '已签到') {
                statusMessage.innerText = '已签到，请在候场区等待面试。';
                statusMessage.style.color = '#1890ff'; statusMessage.style.background = '#e6f7ff';
            } else if (status === '已录取') {
                statusMessage.innerText = '🎉 恭喜你！你已被柑橘音乐录取！';
                statusMessage.style.color = '#52c41a'; statusMessage.style.background = '#f6ffed';
            } else if (status === '未录取') {
                statusMessage.innerText = '很遗憾，本次面试未能通过，祝你前程似锦。';
                statusMessage.style.color = '#ff4d4f'; statusMessage.style.background = '#fff1f0';
            }
            
        } else {
            document.getElementById('applySection').style.display = 'block';
            document.getElementById('statusSection').style.display = 'none';
        }
    }

    async function submitForm() {
        const data = {
            username: currentUser,
            name: document.getElementById('name').value,
            student_id: document.getElementById('student_id').value,
            phone_last4: document.getElementById('phone_last4').value,
            department: document.getElementById('department').value,
            ps_content: document.getElementById('ps_content').value
        };
        if(!data.name || !data.student_id) return alert("请填写必填项！");

        const res = await fetch('/api/submit', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });

        if(res.headers.get('content-type')?.includes('application/json')) {
            const err = await res.json();
            alert(err.message);
        } else {
            const blob = await res.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `TG_报名表.pdf`;
            document.body.appendChild(a); a.click(); a.remove();
            window.URL.revokeObjectURL(url);
            alert("🎉 报名成功！PDF已开始下载。");
            checkMyStatus();
        }
    }

    function switchAdminTab(tab) {
        document.getElementById('tab_list').classList.remove('active');
        document.getElementById('tab_checkin').classList.remove('active');
        
        if(tab === 'list') {
            document.getElementById('tab_list').classList.add('active');
            document.getElementById('adminListView').style.display = 'block';
            document.getElementById('adminCheckInView').style.display = 'none';
        } else {
            document.getElementById('tab_checkin').classList.add('active');
            document.getElementById('adminListView').style.display = 'none';
            document.getElementById('adminCheckInView').style.display = 'block';
            setTimeout(() => document.getElementById('scanInput').focus(), 100);
        }
    }

    async function loadAdminList() {
        const sortByScore = document.getElementById('sortScoreCheckbox').checked;
        const sortParam = sortByScore ? 'score' : 'id';
        
        const res = await fetch(`/api/admin/list?sort=${sortParam}`);
        const data = await res.json();
        const tbody = document.getElementById('adminTableBody');
        tbody.innerHTML = "";
        
        data.data.forEach(row => {
            let statusColor = '#fa8c16'; 
            if (row[5] === '初筛通过') statusColor = '#52c41a';
            if (row[5] === '未通过' || row[5] === '未录取') statusColor = '#ff4d4f';
            if (row[5] === '已签到' || row[5] === '面试中') statusColor = '#1890ff';
            if (row[5] === '已录取') statusColor = '#52c41a';

            let scoreDisplay = row[6] > 0 ? `<strong style="color: #d97706;">${row[6]}分</strong>` : '<span style="color:#ccc;">未打分</span>';

            tbody.innerHTML += `
                <tr>
                    <td>${row[0]}</td>
                    <td>${row[1]}</td>
                    <td>${row[3]}</td>
                    <td style="color: ${statusColor}; font-weight: bold;">${row[5]}</td>
                    <td>${scoreDisplay}</td>
                    <td>
                        <button class="btn btn-sm" onclick="openReview('${row[0]}')">详情/打分</button>
                        <button class="btn btn-sm btn-outline" onclick="previewPDF('${row[0]}')">PDF</button>
                    </td>
                </tr>
            `;
        });
    }

    const scanInput = document.getElementById('scanInput');
    const scanResult = document.getElementById('scanResult');
    const scanActionBox = document.getElementById('scanActionBox');
    let lastScannedCode = ""; 
    
    scanInput.addEventListener('keypress', async function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const code = scanInput.value.trim().toUpperCase(); 
            if(!code) return;

            scanResult.className = "scan-result"; 
            scanResult.innerText = "正在查询...";
            scanActionBox.style.display = 'none'; 
            
            const res = await fetch('/api/admin/checkin', {
                method: 'POST', 
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({barcode_id: code})
            });
            const data = await res.json();
            
            if (data.status === 'success') {
                scanResult.className = "scan-result success-text";
                scanResult.innerText = data.message;
                lastScannedCode = code;
                scanActionBox.style.display = 'flex'; 
            } else {
                scanResult.className = "scan-result error-text";
                scanResult.innerText = data.message;
            }

            scanInput.value = "";
            loadAdminList(); 
        }
    });

    async function openReview(barcode_id) {
        currentReviewId = barcode_id;
        const res = await fetch(`/api/admin/detail/${barcode_id}`);
        const data = await res.json();
        
        if(data.status === 'success') {
            document.getElementById('rv_name').innerText = data.data.name;
            document.getElementById('rv_dept').innerText = data.data.dept;
            document.getElementById('rv_ps').innerText = data.data.ps;
            
            const aiBox = document.getElementById('rv_ai_summary');
            if(data.data.ai_summary) {
                aiBox.innerText = data.data.ai_summary;
                aiBox.style.display = 'block';
            } else {
                aiBox.innerText = "";
                aiBox.style.display = 'none';
            }

            const qBox = document.getElementById('rv_ai_questions');
            qBox.innerText = "";
            qBox.style.display = 'none';

            document.getElementById('score_exp').value = data.data.score_exp || '';
            document.getElementById('score_skill').value = data.data.score_skill || '';
            document.getElementById('score_total').value = data.data.score_total || '';
            document.getElementById('eval_comment').value = data.data.eval_comment || '';

            document.getElementById('reviewModal').style.display = 'flex';
        }
    }

    function closeReview() { document.getElementById('reviewModal').style.display = 'none'; }

    async function generateAISummary() {
        const btn = document.getElementById('btnAi');
        const aiBox = document.getElementById('rv_ai_summary');
        btn.innerText = "生成中...";
        btn.disabled = true;

        const res = await fetch(`/api/admin/ai_summarize/${currentReviewId}`, { method: 'POST' });
        const data = await res.json();
        
        btn.innerText = "✨ 重新生成";
        btn.disabled = false;
        if(data.status === 'success') {
            aiBox.innerText = data.summary;
            aiBox.style.display = 'block';
        } else alert(data.message);
    }

    async function generateAIQuestions() {
        const btn = document.getElementById('btnAiQ');
        const qBox = document.getElementById('rv_ai_questions');
        btn.innerText = "出题中...";
        btn.disabled = true;

        const res = await fetch(`/api/admin/ai_questions/${currentReviewId}`, { method: 'POST' });
        const data = await res.json();
        
        btn.innerText = "✨ 重新出题";
        btn.disabled = false;
        if(data.status === 'success') {
            qBox.innerText = data.questions;
            qBox.style.display = 'block';
        } else alert(data.message);
    }

    async function submitScore() {
        const data = {
            score_exp: parseInt(document.getElementById('score_exp').value) || 0,
            score_skill: parseInt(document.getElementById('score_skill').value) || 0,
            score_total: parseInt(document.getElementById('score_total').value) || 0,
            eval_comment: document.getElementById('eval_comment').value
        };

        const res = await fetch(`/api/admin/score/${currentReviewId}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        const result = await res.json();
        
        if(result.status === 'success') {
            alert('✅ 评分保存成功！');
            closeReview();
            loadAdminList();
        } else {
            alert('保存失败');
        }
    }

    async function updateStatus(status) {
        const res = await fetch(`/api/admin/update_status/${currentReviewId}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({status: status})
        });
        const data = await res.json();
        if(data.status === 'success') {
            alert(`状态已更新为：${status}`);
            closeReview();
            loadAdminList();
        }
    }

    function previewPDF(barcode_id) {
        document.getElementById('pdfIframe').src = `/api/admin/download/${barcode_id}`;
        document.getElementById('pdfModal').style.display = 'flex';
    }
    function closePDF() {
        document.getElementById('pdfModal').style.display = 'none';
        document.getElementById('pdfIframe').src = "";
    }
    function exportCSV() { window.open('/api/admin/export', '_blank'); }
    function logout() {
        currentUser = ""; currentRole = "";
        document.getElementById('login_user').value = "";
        document.getElementById('login_pwd').value = "";
        switchCard('loginCard');
    }
</script>
</body>
</html>
