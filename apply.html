<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>柑橘音乐 - 招新系统</title>
    <style>
        :root { --primary: #1890ff; --bg: #f0f2f5; --text-main: #333333; --border: #d9d9d9; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding-top: 5vh; color: var(--text-main); }
        .container { width: 100%; max-width: 900px; padding: 20px; }
        
        .card { background: #ffffff; padding: 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: none; }
        .card.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        h1 { text-align: center; color: #1f2937; font-size: 24px; margin-bottom: 30px; font-weight: 600; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #4b5563; font-size: 14px; font-weight: 500; }
        input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; outline: none; font-size: 14px; transition: 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(24,144,255,0.2); }
        
        .btn { padding: 10px 16px; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #40a9ff; }
        .btn-full { width: 100%; margin-top: 10px; }
        .btn-sm { padding: 6px 12px; font-size: 13px; }
        .btn-outline { background: transparent; color: var(--text-main); border: 1px solid var(--border); }
        .btn-outline:hover { background: #fafafa; }
        .btn-ai { background: linear-gradient(135deg, #8b5cf6, #6366f1); color: white; border: none; }
        .btn-ai:hover { background: linear-gradient(135deg, #7c3aed, #4f46e5); }
        
        .toggle-link { display: block; text-align: center; margin-top: 20px; color: var(--primary); cursor: pointer; font-size: 14px; }
        .toggle-link:hover { text-decoration: underline; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .top-bar h2 { font-size: 18px; font-weight: 600; }
        .actions { display: flex; gap: 10px; }
        
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background-color: #fafafa; color: #4b5563; font-weight: 500; }
        tr:hover { background-color: #fafafa; }
        
        .status-box { text-align: center; padding: 40px 20px; background: #f6ffed; border: 1px solid #b7eb8f; border-radius: 6px; }
        .status-box h3 { color: #52c41a; margin-bottom: 15px; font-weight: 600; }
        .status-box strong { font-size: 24px; color: #52c41a; letter-spacing: 1px; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 80%; max-width: 700px; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; max-height: 85vh; }
        .modal-header { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 20px; overflow-y: auto; }
        
        .ai-box { background: #f5f3ff; border: 1px solid #ddd6fe; padding: 15px; border-radius: 6px; margin: 15px 0; font-size: 14px; line-height: 1.5; color: #4c1d95;}
        .ps-content { background: #f9fafb; padding: 15px; border-radius: 6px; border: 1px solid var(--border); font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
    </style>
</head>
<body>
<div class="container">
    <!-- 登录 -->
    <div class="card active" id="loginCard" style="max-width: 400px; margin: 0 auto;">
        <h1>柑橘音乐 招新系统</h1>
        <div class="form-group"><label>账号</label><input type="text" id="login_user"></div>
        <div class="form-group"><label>密码</label><input type="password" id="login_pwd"></div>
        <button class="btn btn-full" onclick="login()">登 录</button>
        <span class="toggle-link" onclick="switchCard('registerCard')">没有账号？点击注册</span>
    </div>

    <!-- 注册 -->
    <div class="card" id="registerCard" style="max-width: 400px; margin: 0 auto;">
        <h1>创建账户</h1>
        <div class="form-group"><label>账号</label><input type="text" id="reg_user"></div>
        <div class="form-group"><label>密码</label><input type="password" id="reg_pwd"></div>
        <button class="btn btn-full" onclick="register()">注 册</button>
        <span class="toggle-link" onclick="switchCard('loginCard')">已有账号？返回登录</span>
    </div>

    <!-- 申请人面板 -->
    <div class="card" id="userCard">
        <div class="top-bar">
            <h2>申请人中心</h2>
            <button class="btn btn-sm btn-outline" onclick="logout()">退出登录</button>
        </div>
        <div id="applySection">
            <div class="form-group"><label>真实姓名</label><input type="text" id="name"></div>
            <div class="form-group"><label>学号</label><input type="text" id="student_id"></div>
            <div class="form-group"><label>手机尾号</label><input type="text" id="phone_last4" maxlength="4"></div>
            <div class="form-group"><label>意向部门</label>
                <select id="department"><option>主唱部</option><option>器乐部</option><option>创作部</option><option>宣传部</option></select>
            </div>
            <div class="form-group"><label>个人陈述</label><textarea id="ps_content" rows="5"></textarea></div>
            <button class="btn btn-full" onclick="submitForm()">提交并下载 PDF 报名表</button>
        </div>
        <div id="statusSection" class="status-box" style="display: none;">
            <h3>✅ 报名表已提交</h3>
            <p style="margin-bottom: 10px; color: #666;">你的专属签到编号为：</p>
            <strong id="my_barcode"></strong>
            <p style="margin-top: 15px; color: #666; font-size: 14px;">当前状态：<span id="my_status" style="font-weight: bold; color: #fa8c16;"></span></p>
        </div>
    </div>

    <!-- 管理员面板 -->
    <div class="card" id="adminCard">
        <div class="top-bar">
            <h2>管理员控制台</h2>
            <div class="actions">
                <button class="btn btn-sm btn-outline" onclick="exportCSV()">导出全部 CSV</button>
                <button class="btn btn-sm btn-outline" onclick="logout()">退出登录</button>
            </div>
        </div>
        <table>
            <thead><tr><th>编号</th><th>姓名</th><th>学号</th><th>部门</th><th>状态</th><th>操作</th></tr></thead>
            <tbody id="adminTableBody"></tbody>
        </table>
    </div>
</div>

<!-- 审核 & 详情弹窗 -->
<div id="reviewModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3 style="font-size: 16px;">报名表审核 - <span id="rv_name"></span></h3>
            <button class="btn btn-sm btn-outline" onclick="closeReview()">关闭</button>
        </div>
        <div class="modal-body">
            <p><strong>意向部门：</strong> <span id="rv_dept"></span></p>
            <p style="margin-top: 15px;"><strong>个人陈述原文：</strong></p>
            <div class="ps-content" id="rv_ps"></div>

            <div style="margin-top: 20px; display: flex; align-items: center; justify-content: space-between;">
                <strong>AI 核心摘要：</strong>
                <button class="btn btn-sm btn-ai" onclick="generateAISummary()" id="btnAi">✨ 一键生成摘要</button>
            </div>
            <div class="ai-box" id="rv_ai_summary" style="display: none;"></div>

            <div style="margin-top: 30px; border-top: 1px solid var(--border); padding-top: 20px; display: flex; justify-content: flex-end; gap: 10px;">
                <button class="btn btn-outline" onclick="updateStatus('未通过')">❌ 预审未通过</button>
                <button class="btn" style="background: #52c41a;" onclick="updateStatus('初筛通过')">✅ 预审通过</button>
            </div>
        </div>
    </div>
</div>

<!-- PDF 预览弹窗 -->
<div id="pdfModal" class="modal-overlay">
    <div class="modal-content" style="width: 85%; height: 85%; max-width: none;">
        <div class="modal-header">
            <h3 style="font-size: 16px;">PDF 报名表预览</h3>
            <button class="btn btn-sm btn-outline" onclick="closePDF()">关闭</button>
        </div>
        <iframe id="pdfIframe" src="" style="width: 100%; height: 100%; border: none;"></iframe>
    </div>
</div>

<script>
    let currentUser = "";
    let currentRole = "";
    let currentReviewId = "";

    function switchCard(id) {
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    async function login() {
        const username = document.getElementById('login_user').value;
        const password = document.getElementById('login_pwd').value;
        const res = await fetch('/api/login', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        const data = await res.json();
        if (data.status === 'success') {
            currentUser = username;
            currentRole = data.role;
            if(currentRole === 'admin') {
                switchCard('adminCard');
                loadAdminList();
            } else {
                switchCard('userCard');
                checkMyStatus();
            }
        } else alert(data.message);
    }

    async function register() {
        const username = document.getElementById('reg_user').value;
        const password = document.getElementById('reg_pwd').value;
        const res = await fetch('/api/register', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        const data = await res.json();
        alert(data.message);
        if(data.status === 'success') switchCard('loginCard');
    }

    async function checkMyStatus() {
        const res = await fetch(`/api/my_application?username=${currentUser}`);
        const data = await res.json();
        if(data.status === 'success') {
            document.getElementById('applySection').style.display = 'none';
            document.getElementById('statusSection').style.display = 'block';
            document.getElementById('my_barcode').innerText = data.data.barcode_id;
            document.getElementById('my_status').innerText = data.data.status;
        } else {
            document.getElementById('applySection').style.display = 'block';
            document.getElementById('statusSection').style.display = 'none';
        }
    }

    async function submitForm() {
        const data = {
            username: currentUser,
            name: document.getElementById('name').value,
            student_id: document.getElementById('student_id').value,
            phone_last4: document.getElementById('phone_last4').value,
            department: document.getElementById('department').value,
            ps_content: document.getElementById('ps_content').value
        };
        if(!data.name || !data.student_id) return alert("请填写必填项！");

        const res = await fetch('/api/submit', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });

        if(res.headers.get('content-type')?.includes('application/json')) {
            const err = await res.json();
            alert(err.message);
        } else {
            const blob = await res.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `TG_报名表.pdf`;
            document.body.appendChild(a); a.click(); a.remove();
            window.URL.revokeObjectURL(url);
            alert("🎉 报名成功！PDF已开始下载。");
            checkMyStatus();
        }
    }

    async function loadAdminList() {
        const res = await fetch('/api/admin/list');
        const data = await res.json();
        const tbody = document.getElementById('adminTableBody');
        tbody.innerHTML = "";
        
        data.data.forEach(row => {
            let statusColor = row[5] === '初筛通过' ? '#52c41a' : (row[5] === '未通过' ? '#ff4d4f' : '#fa8c16');
            tbody.innerHTML += `
                <tr>
                    <td>${row[0]}</td>
                    <td>${row[1]}</td>
                    <td>${row[2]}</td>
                    <td>${row[3]}</td>
                    <td style="color: ${statusColor}; font-weight: bold;">${row[5]}</td>
                    <td>
                        <button class="btn btn-sm" onclick="openReview('${row[0]}')">审核</button>
                        <button class="btn btn-sm btn-outline" onclick="previewPDF('${row[0]}')">PDF</button>
                    </td>
                </tr>
            `;
        });
    }

    async function openReview(barcode_id) {
        currentReviewId = barcode_id;
        const res = await fetch(`/api/admin/detail/${barcode_id}`);
        const data = await res.json();
        
        if(data.status === 'success') {
            document.getElementById('rv_name').innerText = data.data.name;
            document.getElementById('rv_dept').innerText = data.data.dept;
            document.getElementById('rv_ps').innerText = data.data.ps;
            
            const aiBox = document.getElementById('rv_ai_summary');
            if(data.data.ai_summary) {
                aiBox.innerText = data.data.ai_summary;
                aiBox.style.display = 'block';
            } else {
                aiBox.innerText = "";
                aiBox.style.display = 'none';
            }
            document.getElementById('reviewModal').style.display = 'flex';
        }
    }

    function closeReview() { document.getElementById('reviewModal').style.display = 'none'; }

    async function generateAISummary() {
        const btn = document.getElementById('btnAi');
        const aiBox = document.getElementById('rv_ai_summary');
        btn.innerText = "生成中...";
        btn.disabled = true;

        const res = await fetch(`/api/admin/ai_summarize/${currentReviewId}`, { method: 'POST' });
        const data = await res.json();
        
        btn.innerText = "✨ 重新生成";
        btn.disabled = false;
        if(data.status === 'success') {
            aiBox.innerText = data.summary;
            aiBox.style.display = 'block';
        } else {
            // 如果没配置Key，这里会弹出友好提示
            alert(data.message);
        }
    }

    async function updateStatus(status) {
        const res = await fetch(`/api/admin/update_status/${currentReviewId}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({status: status})
        });
        const data = await res.json();
        if(data.status === 'success') {
            alert(`已标记为：${status}`);
            closeReview();
            loadAdminList();
        }
    }

    function previewPDF(barcode_id) {
        document.getElementById('pdfIframe').src = `/api/admin/download/${barcode_id}`;
        document.getElementById('pdfModal').style.display = 'flex';
    }
    function closePDF() {
        document.getElementById('pdfModal').style.display = 'none';
        document.getElementById('pdfIframe').src = "";
    }
    function exportCSV() { window.open('/api/admin/export', '_blank'); }
    function logout() {
        currentUser = ""; currentRole = "";
        document.getElementById('login_user').value = "";
        document.getElementById('login_pwd').value = "";
        switchCard('loginCard');
    }
</script>
</body>
</html>
